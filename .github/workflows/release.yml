name: Release

# Publishes to PyPI when a v* tag is pushed. Authentication is PyPI Trusted
# Publishing: GitHub mints a short-lived OIDC token proving the build really
# came from this repo, so no API token is stored anywhere.
#
# One-time setup on PyPI (Your projects -> Publishing, or the "pending
# publisher" form for a project that does not exist yet):
#   owner: Totti0135   repository: model-council
#   workflow: release.yml   environment: pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so this must be a full version.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Smoke test
        run: uv run python tests/test_smoke.py
        env:
          # Never pick up a stray .env on the runner: this run must stay offline.
          COUNCIL_ENV_FILE: /nonexistent

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/model-council-mcp
    permissions:
      id-token: write # required to mint the OIDC token PyPI verifies
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag, so this must be a full version.
      - uses: astral-sh/setup-uv@v10.0.0

      - name: Verify the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match pyproject.toml version ${version}"
            exit 1
          fi
          echo "publishing ${version}"

      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Listing on the MCP Registry, which stores metadata only and verifies
  # ownership by reading the `mcp-name:` marker out of the package README on
  # PyPI. That read is why this waits for the upload to become visible rather
  # than running straight after it.
  registry:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC, proving to the registry that this is our repo
    steps:
      - uses: actions/checkout@v7

      - name: Wait for the release to appear on PyPI
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          url="https://pypi.org/pypi/model-council-mcp/${version}/json"
          for i in $(seq 1 30); do
            if curl -sfo /dev/null "$url"; then
              echo "visible after $((i * 10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::model-council-mcp ${version} still not on PyPI after 5 minutes"
          exit 1

      - name: Put the released version into server.json
        run: |
          version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
