[project]
name = "model-council-mcp"
version = "0.6.0"
description = "An MCP server that lets your assistant consult other LLMs — ask them, compare their answers, and synthesize a conclusion."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "qinsisheng" }]
keywords = ["mcp", "model-context-protocol", "llm", "claude", "openai", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # 2.x only: FastMCP is gone, and the server is written against MCPServer.
    "mcp>=2,<3",
    "httpx>=0.27.0",
]

[project.scripts]
model-council-mcp = "model_council.server:main"

[project.urls]
Homepage = "https://github.com/Totti0135/model-council"
Issues = "https://github.com/Totti0135/model-council/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/model_council"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]
